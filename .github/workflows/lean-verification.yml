name: Validated proof payload and release infrastructure
on:
  push:
    branches: [main, 'release/**', 'formalization/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject incomplete final roots and missing SOS mutation hook
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cglmp5-receipts"
          python -B verification/lean/test_inspection_inventory.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/inspection_guard_tests.log"
          python -B verification/lean/check_mapped_inventory.py --output "$RUNNER_TEMP/cglmp5-receipts/MAPPED_INVENTORY.json"
          python -B verification/lean/test_mapped_inventory.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/mapped_inventory_guard_tests.log"
          python -O -B verification/lean/test_mapped_inventory.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/mapped_inventory_optimized_guard_tests.log"
          python -B verification/lean/test_axiom_report.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/axiom_report_guard_tests.log"
          python -O -B verification/lean/test_axiom_report.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/axiom_report_optimized_guard_tests.log"
          python -B scripts/test_negative_control_support.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/immutability_guard_tests.log"
          python -B scripts/test_lean_rejection.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/semantic_rejection_guard_tests.log"
          python -O -B scripts/test_lean_rejection.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/semantic_rejection_optimized_guard_tests.log"
          python -B verification/lean/ci/test_ci_configuration.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/ci_guard_tests.log"
          python -B scripts/test_source_readback.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/source_readback_guard_tests.log"
          python -B scripts/test_source_manifest.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/source_manifest_guard_tests.log"
          python -B scripts/test_integrated_ci.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/integrated_ci_guard_tests.log"
          python -B scripts/test_release_payload.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/release_payload_guard_tests.log"
          python -O -B scripts/test_release_payload.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/release_payload_optimized_guard_tests.log"
          python -B scripts/check_release_payload.py --output "$RUNNER_TEMP/cglmp5-receipts/FINAL_PAYLOAD_CHECK.json"
          python -B scripts/test_audit_receipts.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/audit_receipt_guard_tests.log"
          python -O -B scripts/test_audit_receipts.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/audit_receipt_optimized_guard_tests.log"
          python -B scripts/test_lean_replay_paths.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/path_containment_guard_tests.log"
          python -B verification/lean/test_kernel_replay_pipeline.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/kernel_pipeline_tests.log"
          python -B verification/lean/test_checker_fixture_classifier.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/checker_fixture_classifier_tests.log"
          python -O -B verification/lean/test_checker_fixture_classifier.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/checker_fixture_classifier_optimized_tests.log"
          python -B verification/lean/test_sos_corruption_classifier.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/sos_classifier_tests.log"
          python -O -B verification/lean/test_sos_corruption_classifier.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/sos_classifier_optimized_tests.log"
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then git status --short; exit 1; fi
          python -B scripts/check_lean_completion_readiness.py --output "$RUNNER_TEMP/cglmp5-receipts/READINESS.json"
          python -B scripts/check_source_manifest.py 2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/source_manifest.log"
          python -B scripts/check_lean_frozen_inputs.py --output "$RUNNER_TEMP/cglmp5-receipts/FROZEN_INPUTS.json"
          python -B scripts/check_lean_trust_surface.py --output "$RUNNER_TEMP/cglmp5-receipts/TRUST_SURFACE.json"
      # Full proof replay remains available in scripts/run_lean_verification.py
      # and in the prior workflow history. It is not a default release gate:
      # repeat it only after a new proof-critical defect or payload change.
      - name: Validate all four workflows with official hash-pinned actionlint
        run: |
          set -euo pipefail
          TOOL_DIR="$RUNNER_TEMP/cglmp5-actionlint"
          mkdir -p "$TOOL_DIR"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$TOOL_DIR/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | (cd "$TOOL_DIR" && sha256sum --check --strict)
          tar -xzf "$TOOL_DIR/actionlint.tar.gz" -C "$TOOL_DIR" actionlint
          "$TOOL_DIR/actionlint" -version | tee "$RUNNER_TEMP/cglmp5-receipts/actionlint-version.log"
          "$TOOL_DIR/actionlint" -shellcheck= -pyflakes= -oneline \
            .github/workflows/lean-verification.yml .github/workflows/verify.yml \
            .github/workflows/release-v0.1.1.yml .github/workflows/release-v0.2.0.yml \
            2>&1 | tee "$RUNNER_TEMP/cglmp5-receipts/actionlint.log"
      - name: Package exact final source and verify every archived byte
        run: |
          set -euo pipefail
          git archive --format=tar --output="$RUNNER_TEMP/cglmp5-source.tar" HEAD
          python -B - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile
          state = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = state / 'cglmp5-source.tar'
          tracked = {}
          for record in subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD']).split(b'\0'):
              if not record:
                  continue
              meta, name = record.split(b'\t', 1)
              mode, kind, oid = meta.decode().split()
              if kind != 'blob' or mode not in ('100644', '100755'):
                  raise SystemExit('Unsupported source-tree entry: ' + name.decode())
              tracked[name.decode()] = (mode, oid)
          checksums = {}
          manifest_bytes = None
          with tarfile.open(archive, 'r:') as package:
              for member in package:
                  if member.isdir():
                      continue
                  if not member.isfile() or member.name not in tracked or member.name in checksums:
                      raise SystemExit('Unexpected or duplicate archive member: ' + member.name)
                  data = package.extractfile(member).read()
                  oid = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  mode = '100755' if member.mode & 0o111 else '100644'
                  if (mode, oid) != tracked[member.name]:
                      raise SystemExit('Archive differs from exact final Git blob: ' + member.name)
                  checksums[member.name] = hashlib.sha256(data).hexdigest()
                  if member.name == 'SOURCE_MANIFEST.sha256':
                      manifest_bytes = data
          if set(checksums) != set(tracked) or manifest_bytes is None:
              raise SystemExit('Archive source-file set is incomplete')
          expected = {}
          for line in manifest_bytes.decode().splitlines():
              if line.startswith('#'):
                  continue
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
              if not match or match[2] in expected:
                  raise SystemExit('Malformed or duplicate source-manifest entry')
              expected[match[2]] = match[1]
          if expected != {p: h for p, h in checksums.items() if p != 'SOURCE_MANIFEST.sha256'}:
              raise SystemExit('Archived source manifest does not match every packaged byte')
          result = dict(status='PASS', scope='Source packaging only; no proof replay',
                        commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                        source_files=len(checksums), archive_bytes=archive.stat().st_size,
                        archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest(),
                        source_manifest_sha256=checksums['SOURCE_MANIFEST.sha256'])
          (state / 'cglmp5-receipts/SOURCE_PACKAGE_READBACK.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve lightweight release receipts, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cglmp5-receipts/
          if-no-files-found: error
          retention-days: 30
